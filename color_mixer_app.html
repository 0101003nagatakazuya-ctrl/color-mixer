    <script>
        lucide.createIcons();

        // ★★★ここにステップ2で取得したCSVのURLを貼り付けます★★★
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxSjAHGhduvBkTkbEU9rILUmyPAPPUw0GKt6cnlnwbqdpWJvnQCxqRapbQ4kQJi3wEj-UiefsvRHmF/pub?gid=0&single=true&output=csv"; 

        // 薬剤データベース（メモリ上）
        let drugDatabase = {};

        // 起動時にスプレッドシートからデータを取得する
        async function loadDatabase() {
            const statusEl = document.getElementById('db-status');
            
            // URLが初期値のままの場合はスキップ
            if (SPREADSHEET_CSV_URL === "YOUR_SPREADSHEET_CSV_URL") {
                statusEl.innerHTML = '<i data-lucide="alert-triangle" class="w-3 h-3"></i> DB未接続';
                statusEl.classList.replace('bg-yellow-500', 'bg-gray-500');
                lucide.createIcons();
                return;
            }

            try {
                const response = await fetch(SPREADSHEET_CSV_URL);
                if (!response.ok) throw new Error("ネットワークエラー");
                
                const csvText = await response.text();
                const lines = csvText.split('\n');
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line) {
                        const columns = line.split(',');
                        if (columns.length >= 2) {
                            const barcode = columns[0].trim();
                            const drugName = columns[1].trim();
                            if (barcode && drugName) {
                                drugDatabase[barcode] = drugName;
                            }
                        }
                    }
                }
                
                console.log("DBロード完了:", drugDatabase);
                statusEl.innerHTML = '<i data-lucide="database" class="w-3 h-3"></i> DB接続済';
                statusEl.classList.replace('bg-yellow-500', 'bg-green-500');
            } catch (error) {
                console.error("DB読み込み失敗:", error);
                statusEl.innerHTML = '<i data-lucide="x-circle" class="w-3 h-3"></i> DBエラー';
                statusEl.classList.replace('bg-yellow-500', 'bg-red-500');
            }
            lucide.createIcons();
        }

        // 入力値がバーコードなら、DBと照合して名前に変換する
        function checkDatabaseAndCalculate(inputElement) {
            const val = inputElement.value.trim();
            if (drugDatabase[val]) {
                inputElement.value = drugDatabase[val];
                showToast(`DBから「${drugDatabase[val]}」を読み込みました`);
            }
            calculate();
        }

        // カメラ関連の変数
        let html5QrcodeScanner = null;
        let currentTargetInputId = null;

        // カメラ起動処理
        function startScanner(inputId) {
            currentTargetInputId = inputId;
            const container = document.getElementById('scanner-container');
            const readerEl = document.getElementById('reader');
            
            container.classList.remove('hidden');
            container.classList.add('flex');
            readerEl.classList.add('scanning');

            html5QrcodeScanner = new Html5Qrcode("reader");
            
            const config = { fps: 10, qrbox: { width: 250, height: 100 } };
            
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).catch((err) => {
                alert("カメラの起動に失敗しました。ブラウザのカメラ許可設定を確認してください。\nエラー: " + err);
                stopScanner();
            });
        }

        // スキャン成功時の処理
        function onScanSuccess(decodedText, decodedResult) {
            stopScanner();
            if('vibrate' in navigator) navigator.vibrate(200);

            const targetInput = document.getElementById(currentTargetInputId);
            
            if (drugDatabase[decodedText]) {
                targetInput.value = drugDatabase[decodedText];
                showToast(`読み込み成功: ${drugDatabase[decodedText]}`);
            } else {
                targetInput.value = `未登録: ${decodedText}`;
                showToast("未登録のバーコードです");
            }
            
            calculate();
        }

        function onScanFailure(error) {
            // エラー無視
        }

        // カメラ停止処理
        function stopScanner() {
            const container = document.getElementById('scanner-container');
            const readerEl = document.getElementById('reader');
            
            container.classList.add('hidden');
            container.classList.remove('flex');
            readerEl.classList.remove('scanning');

            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                }).catch((err) => {
                    console.error("カメラの停止に失敗", err);
                });
            }
        }

        // グラム計算処理
        function calculate() {
            calcSection('root');
            
            const midTotal = parseFloat(document.getElementById('mid-total').value) || 0;
            const midInputs = document.getElementById('mid-inputs');
            
            if (midTotal > 0) {
                midInputs.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                midInputs.classList.add('opacity-50', 'pointer-events-none');
            }
            calcSection('mid');

            // 毛先の計算と表示切り替え
            const tipTotal = parseFloat(document.getElementById('tip-total').value) || 0;
            const tipInputs = document.getElementById('tip-inputs');
            
            if (tipTotal > 0) {
                tipInputs.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                tipInputs.classList.add('opacity-50', 'pointer-events-none');
            }
            calcSection('tip');
        }

        function calcSection(prefix) {
            const total = parseFloat(document.getElementById(`${prefix}-total`).value) || 0;
            const ratioA = parseFloat(document.getElementById(`${prefix}-ratio-a`).value) || 0;
            const ratioB = parseFloat(document.getElementById(`${prefix}-ratio-b`).value) || 0;
            const ratioC = parseFloat(document.getElementById(`${prefix}-ratio-c`).value) || 0;
            const ratioD = parseFloat(document.getElementById(`${prefix}-ratio-d`).value) || 0;
            
            const drugA = document.getElementById(`${prefix}-drug-a`).value || '薬剤A';
            const drugB = document.getElementById(`${prefix}-drug-b`).value || '薬剤B';
            const drugC = document.getElementById(`${prefix}-drug-c`).value || '薬剤C';
            const drugD = document.getElementById(`${prefix}-drug-d`).value || '薬剤D';
            
            const oxiType = document.getElementById(`${prefix}-oxi-type`).value;
            const oxiRatio = parseFloat(document.getElementById(`${prefix}-oxi-ratio`).value) || 1;

            const totalRatio = ratioA + ratioB + ratioC + ratioD;
            
            let gA = 0, gB = 0, gC = 0, gD = 0;
            if (totalRatio > 0) {
                gA = (ratioA / totalRatio) * total;
                gB = (ratioB / totalRatio) * total;
                gC = (ratioC / totalRatio) * total;
                gD = (ratioD / totalRatio) * total;
            }

            const gOxi = total * oxiRatio;

            document.getElementById(`${prefix}-name-a`).textContent = drugA;
            document.getElementById(`${prefix}-name-b`).textContent = drugB;
            document.getElementById(`${prefix}-name-c`).textContent = drugC;
            document.getElementById(`${prefix}-name-d`).textContent = drugD;
            
            document.getElementById(`${prefix}-g-a`).textContent = gA.toFixed(1) + 'g';
            document.getElementById(`${prefix}-g-b`).textContent = gB.toFixed(1) + 'g';
            document.getElementById(`${prefix}-g-c`).textContent = gC.toFixed(1) + 'g';
            document.getElementById(`${prefix}-g-d`).textContent = gD.toFixed(1) + 'g';
            
            document.getElementById(`${prefix}-oxi-label`).textContent = `2剤 (${oxiType})`;
            document.getElementById(`${prefix}-g-oxi`).textContent = gOxi.toFixed(1) + 'g';
        }

        // クリップボードにコピー
        function copyToClipboard() {
            let text = "";

            // メモ欄の取得
            const memo = document.getElementById('memo-input').value.trim();
            if (memo) {
                text += `【その他指示・メモ】\n${memo}\n\n`;
            }

            text += buildSectionText('root', '【根元・ワンタッチ】');
            
            const midTotal = parseFloat(document.getElementById('mid-total').value) || 0;
            if (midTotal > 0) {
                text += "\n" + buildSectionText('mid', '【中間】');
            }

            const tipTotal = parseFloat(document.getElementById('tip-total').value) || 0;
            if (tipTotal > 0) {
                text += "\n" + buildSectionText('tip', '【毛先】');
            }

            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            showToast('カルテ用テキストをコピーしました');
        }

        function buildSectionText(prefix, label) {
            const total = document.getElementById(`${prefix}-total`).value;
            const oxiType = document.getElementById(`${prefix}-oxi-type`).value;
            const oxiRatio = document.getElementById(`${prefix}-oxi-ratio`).value;

            let t = `${label} ${total}g / ${oxiType} (${oxiRatio}倍)\n`;
            
            const suffixes = ['a', 'b', 'c', 'd'];
            suffixes.forEach(suffix => {
                const drugName = document.getElementById(`${prefix}-drug-${suffix}`).value || '未入力';
                const gStr = document.getElementById(`${prefix}-g-${suffix}`).textContent;
                
                // グラム数が0より大きい（実際に使われている）薬剤のみをカルテに出力
                if (parseFloat(gStr) > 0) {
                    t += `・${drugName} ${gStr}\n`;
                }
            });

            return t.trim();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => { toast.classList.add('opacity-0'); }, 3000);
        }

        // 初期化
        window.onload = () => {
            loadDatabase(); // データベース読み込みを開始
            calculate();
        };
    </script>
</body>
</html>
